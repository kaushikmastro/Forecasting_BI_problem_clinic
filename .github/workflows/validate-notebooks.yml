name: Validate notebooks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependency
        run: python -m pip install --upgrade pip nbformat

      - name: Validate notebook JSON and schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbformat.validator import validate

          notebook_paths = sorted(
              p for p in Path('.').rglob('*.ipynb') if '.ipynb_checkpoints' not in p.parts
          )

          if not notebook_paths:
              print('No notebooks found.')
              raise SystemExit(0)

          failures = []
          output_failures = []

          for path in notebook_paths:
              try:
                  nb = nbformat.read(path, as_version=4)
                  validate(nb)
              except Exception as exc:
                  failures.append((path, exc))
                  continue

              for idx, cell in enumerate(nb.cells):
                  if cell.get('cell_type') == 'code' and cell.get('outputs'):
                      output_failures.append((path, idx + 1))

          if failures:
              print('Invalid notebook files:')
              for path, exc in failures:
                  print(f'- {path}: {exc}')

          if output_failures:
              print('Notebooks must be committed with cleared code-cell outputs:')
              for path, cell_index in output_failures:
                  print(f'- {path} (code cell #{cell_index})')

          if failures or output_failures:
              raise SystemExit(1)

          print(f'Validated {len(notebook_paths)} notebook(s).')
          PY
